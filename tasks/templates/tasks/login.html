{% extends 'tasks/base.html' %}

{% block content %}
<div class="auth-card">
    <h2>Iniciar Sesión</h2>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>
    <p class="auth-links">¿No tienes cuenta? <a href="{% url 'register' %}">Regístrate aquí</a></p>
</div>
{% endblock %}
