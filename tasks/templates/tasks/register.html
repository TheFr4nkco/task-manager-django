{% extends 'tasks/base.html' %}

{% block content %}
<div class="auth-card">
    <h2>Crear Cuenta</h2>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary btn-block">Registrarse</button>
    </form>
    <p class="auth-links">¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
</div>
{% endblock %}
